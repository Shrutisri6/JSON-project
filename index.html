<!DOCTYPE html>
<html>
<head>
    <title>Student Information using JSON</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        form {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        .student {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <h1>Student Information</h1>

    <form id="studentForm">
        <label>Name</label>
        <input type="text" id="name" required>

        <label>Age</label>
        <input type="number" id="age" required>

        <label>Department</label>
        <input type="text" id="department" required>

        <label>Marks</label>
        <input type="number" id="marks" required>

        <label>City</label>
        <input type="text" id="city" required>

        <button type="submit">Add Student</button>
    </form>

    <h2>Student List</h2>
    <div id="studentList"></div>

    <h2>JSON Data</h2>
    <pre id="jsonData"></pre>

    <script src="script.js"></script>
</body>
</html>
